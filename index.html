<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Red Rose Garments - Online Store & Video Shopping</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --primary: #25D366;
      --primary-dark: #128C7E;
      --accent: #e11d48;
      --accent-soft: #fff1f2;
      --video-btn: #8b5cf6;
      --video-btn-hover: #7c3aed;
      --dark: #0f172a;
      --slate: #64748b;
      --light-bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 12px 28px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 24px 48px rgba(15, 23, 42, 0.14);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--light-bg);
      color: var(--dark);
      overflow-x: hidden;
    }

    /* Top Strip */
    .top-bar {
      background: linear-gradient(90deg, #0f172a, #1e293b);
      color: #f8fafc;
      font-size: 0.8rem;
      text-align: center;
      padding: 9px 16px;
      font-weight: 500;
    }
    .top-bar span {
      color: #fb7185;
      font-weight: 700;
    }

    /* Header */
    header {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--border);
    }

    .nav-container {
      max-width: 1240px;
      margin: auto;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--dark);
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .brand-logo .logo-icon {
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }
    .brand-logo span {
      color: var(--accent);
    }

    .search-box {
      flex: 1;
      max-width: 420px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      border-radius: 30px;
      border: 1px solid var(--border);
      background: #f1f5f9;
      font-size: 0.88rem;
      outline: none;
    }
    .search-box input:focus {
      background: #fff;
      border-color: var(--accent);
    }
    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--slate);
      font-size: 0.9rem;
    }

    .cart-btn {
      background: #f1f5f9;
      border: none;
      padding: 9px 16px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--dark);
    }
    .cart-badge {
      background: var(--accent);
      color: white;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 20px;
      padding: 2px 7px;
    }

    /* Main Store Banner */
    .banner-wrapper {
      max-width: 1240px;
      margin: 18px auto 14px;
      padding: 0 16px;
    }
    .banner-card {
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      background: #000;
    }
    .banner-card img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* Video Call CTA Strip */
    .video-strip {
      max-width: 1240px;
      margin: 0 auto 24px;
      padding: 0 16px;
    }
    .video-strip-content {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      border-radius: 14px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.25);
    }
    .video-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .video-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }
    .video-text h4 {
      font-size: 1rem;
      font-weight: 800;
      margin-bottom: 2px;
    }
    .video-text p {
      font-size: 0.8rem;
      color: #e0e7ff;
    }
    .btn-video-call {
      background: #ffffff;
      color: #6d28d9;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 0.88rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s;
    }
    .btn-video-call:hover {
      transform: scale(1.04);
    }

    /* Main Container & Filters */
    .main-container {
      max-width: 1240px;
      margin: auto;
      padding: 0 18px 70px;
    }

    .filter-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .category-scroll::-webkit-scrollbar { display: none; }

    .cat-pill {
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--slate);
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .cat-pill.active {
      background: var(--dark);
      color: #fff;
      border-color: var(--dark);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    }

    /* Product Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 22px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-md);
    }

    .card-img-holder {
      position: relative;
      width: 100%;
      padding-top: 112%;
      background: #f1f5f9;
      overflow: hidden;
    }
    .card-img-holder img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      z-index: 2;
    }
    .product-badge.sale { background: #fee2e2; color: #dc2626; }
    .product-badge.trending { background: #ffe4e6; color: #e11d48; }
    .product-badge.popular { background: #dcfce7; color: #15803d; }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .card-cat {
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--slate);
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .card-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 6px;
      line-height: 1.35;
    }
    .card-desc {
      font-size: 0.8rem;
      color: var(--slate);
      line-height: 1.45;
      margin-bottom: 12px;
      flex-grow: 1;
    }

    .price-wrap {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 14px;
    }
    .price-wrap .price-now {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--dark);
    }
    .price-wrap .price-mrp {
      font-size: 0.85rem;
      text-decoration: line-through;
      color: var(--slate);
    }
    .price-wrap .price-off {
      font-size: 0.75rem;
      font-weight: 700;
      color: #16a34a;
      background: #dcfce7;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-action-vc {
      background: #f5f3ff;
      color: #6d28d9;
      border: 1px solid #ddd6fe;
      padding: 9px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn-action-buy {
      background: var(--primary);
      color: white;
      border: none;
      padding: 9px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-decoration: none;
    }

    /* Floating WhatsApp Button */
    .float-wa-btn {
      position: fixed;
      bottom: 22px;
      right: 22px;
      background: var(--primary);
      color: #fff;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 24px rgba(37, 211, 102, 0.4);
      text-decoration: none;
      z-index: 1000;
    }

    /* Cart Drawer */
    .cart-drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s;
    }
    .cart-drawer-overlay.active { opacity: 1; visibility: visible; }
    .cart-drawer {
      position: fixed;
      top: 0;
      right: -420px;
      width: 100%;
      max-width: 400px;
      height: 100%;
      background: #ffffff;
      z-index: 2001;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cart-drawer.active { right: 0; }
    .drawer-top {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drawer-body { flex: 1; overflow-y: auto; padding: 18px; }
    .drawer-bottom { padding: 18px; border-top: 1px solid var(--border); background: #f8fafc; }
    .field-input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; }
    .btn-checkout { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }

    @media (max-width: 768px) {
      .video-strip-content { text-align: left; }
      .search-box { order: 3; width: 100%; max-width: 100%; }
      .nav-container { flex-wrap: wrap; }
      .card-actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- 1. Top Announcement Bar (New 600+ Stock Notice) -->
  <div class="top-bar">
    🎉 <span>NAYA STOCK AA GAYA:</span> 600+ Designer Sarees & Cotton Suits Live | Direct WhatsApp Order
  </div>

  <!-- Header -->
  <header>
    <div class="nav-container">
      <a href="#" class="brand-logo">
        <div class="logo-icon"><i class="fas fa-bag-shopping"></i></div>
        <div>Red Rose <span>Garments</span></div>
      </a>

      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search saree, kurti, cotton suit..." oninput="handleSearch()" />
      </div>

      <button class="cart-btn" onclick="toggleCart()">
        <i class="fas fa-cart-shopping"></i>
        <span>Cart</span>
        <span class="cart-badge" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <!-- Store Main Banner -->
  <div class="banner-wrapper">
    <div class="banner-card">
      <img src="IMG_20260816_112241.png" alt="Red Rose Garments Banner" />
    </div>
  </div>

  <!-- 2. Video Call Shopping Strip -->
  <div class="video-strip">
    <div class="video-strip-content">
      <div class="video-info">
        <div class="video-icon-box"><i class="fas fa-video"></i></div>
        <div class="video-text">
          <h4>Dukan Se Live Video Call Par Kapda Pasand Karein!</h4>
          <p>WhatsApp Video Call par poora stock aur alag-alag color options dekhein.</p>
        </div>
      </div>
      <a href="https://wa.me/918766278943?text=Namaste!%20Mujhe%20dukan%20ka%20stock%20Video%20Call%20par%20dekhna%20hai." target="_blank" class="btn-video-call">
        <i class="fab fa-whatsapp"></i> Book Video Call
      </a>
    </div>
  </div>

  <!-- Main Container -->
  <main class="main-container">
    
    <!-- 3. Real Stock Category Filters -->
    <div class="filter-section">
      <div class="category-scroll">
        <button class="cat-pill active" onclick="setCategory('all', this)">All Items</button>
        <button class="cat-pill" onclick="setCategory('sarees', this)">Sarees (Silk & Box)</button>
        <button class="cat-pill" onclick="setCategory('suits', this)">Ladies Suits (Cotton)</button>
        <button class="cat-pill" onclick="setCategory('kids', this)">Kids Wear</button>
      </div>
    </div>

    <!-- Product Grid -->
    <div class="products-grid" id="productsGrid"></div>
  </main>

  <!-- Cart Drawer -->
  <div class="cart-drawer-overlay" id="cartOverlay" onclick="toggleCart()"></div>
  <div class="cart-drawer" id="cartDrawer">
    <div class="drawer-top">
      <h3 style="font-size: 1.1rem;">Shopping Cart (<span id="drawerCount">0</span>)</h3>
      <button onclick="toggleCart()" style="border:none; background:#f1f5f9; width:30px; height:30px; border-radius:50%; cursor:pointer;">✕</button>
    </div>
    <div class="drawer-body" id="drawerItems"></div>
    <div class="drawer-bottom" id="drawerFooter">
      <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-weight:800; font-size:1.1rem;">
        <span>Total:</span>
        <span id="totalPrice">₹0</span>
      </div>
      <input type="text" id="custName" class="field-input" placeholder="Aapka Naam" />
      <input type="text" id="custAddress" class="field-input" placeholder="Delivery Address / City" />
      <button class="btn-checkout" onclick="checkoutWhatsApp()"><i class="fab fa-whatsapp"></i> Confirm on WhatsApp</button>
    </div>
  </div>

  <!-- Floating WhatsApp -->
  <a href="https://wa.me/918766278943?text=Namaste!%20Mujhe%20Red%20Rose%20Garments%20ka%20stock%20dekhna%20hai." target="_blank" class="float-wa-btn">
    <i class="fab fa-whatsapp"></i>
  </a>

  <!-- Script Logic -->
  <script>
    const STORE_CONFIG = {
      storeName: "Red Rose Garments",
      whatsappNumber: "918766278943",
      currency: "₹"
    };

    const PRODUCTS = [
      {
        id: 101,
        title: "Girls Festive Yellow Kurti with Pant Set",
        category: "kids",
        desc: "Leheriya wavy multicolor print with mirror work & pant (4-5 Years).",
        price: 450,
        oldPrice: 650,
        badge: "Kids Special",
        badgeType: "trending",
        image: "IMG_20260902_000740.png"
      },
      {
        id: 102,
        title: "Suryajyoti Pure Cotton Ready Suit Set",
        category: "suits",
        desc: "Comfortable daily & party wear pure cotton unstitched/ready suit material with dupatta.",
        price: 799,
        oldPrice: 1150,
        badge: "New Stock",
        badgeType: "popular",
        image: "https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 103,
        title: "Kanya Silk Designer Fancy Saree",
        category: "sarees",
        desc: "Rich festive border with elegant silk weaving & matched blouse piece.",
        price: 1850,
        oldPrice: 2499,
        badge: "Silk Premium",
        badgeType: "sale",
        image: "https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 104,
        title: "Kayaan Floral Box Saree Collection",
        category: "sarees",
        desc: "Lightweight soft georgette printed daily wear saree in premium box pack.",
        price: 499,
        oldPrice: 750,
        badge: "Budget Choice",
        badgeType: "popular",
        image: "https://images.unsplash.com/photo-1609357605129-26f69add5d6e?auto=format&fit=crop&w=600&q=80"
      }
    ];

    let currentCategory = 'all';
    let currentSearch = '';
    let cart = [];

    function renderCatalog() {
      const grid = document.getElementById("productsGrid");
      grid.innerHTML = "";

      let list = PRODUCTS.filter(p => {
        const matchesCategory = (currentCategory === 'all' || p.category === currentCategory);
        const matchesSearch = p.title.toLowerCase().includes(currentSearch.toLowerCase()) || 
                              p.desc.toLowerCase().includes(currentSearch.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      list.forEach(item => {
        const discount = Math.round(((item.oldPrice - item.price) / item.oldPrice) * 100);
        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
          <div class="card-img-holder">
            <span class="product-badge ${item.badgeType}">${item.badge}</span>
            <img src="${item.image}" alt="${item.title}" loading="lazy" />
          </div>
          <div class="card-body">
            <div class="card-cat">${item.category}</div>
            <h3 class="card-title">${item.title}</h3>
            <p class="card-desc">${item.desc}</p>
            <div class="price-wrap">
              <span class="price-now">${STORE_CONFIG.currency}${item.price}</span>
              <span class="price-mrp">${STORE_CONFIG.currency}${item.oldPrice}</span>
              <span class="price-off">${discount}% OFF</span>
            </div>
            <div class="card-actions">
              <a href="https://wa.me/${STORE_CONFIG.whatsappNumber}?text=Namaste!%20Mujhe%20${encodeURIComponent(item.title)}%20video%20call%20par%20dekhna%20hai." target="_blank" class="btn-action-vc">
                <i class="fas fa-video"></i> Video Dekhein
              </a>
              <a href="https://wa.me/${STORE_CONFIG.whatsappNumber}?text=Namaste!%20Mujhe%20${encodeURIComponent(item.title)}%20(₹${item.price})%20order%20karna%20hai." target="_blank" class="btn-action-buy">
                <i class="fab fa-whatsapp"></i> Buy Now
              </a>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll(".cat-pill").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderCatalog();
    }

    function handleSearch() {
      currentSearch = document.getElementById("searchInput").value;
      renderCatalog();
    }

    function toggleCart() {
      document.getElementById("cartOverlay").classList.toggle("active");
      document.getElementById("cartDrawer").classList.toggle("active");
    }

    renderCatalog();
  </script>
</body>
</html>
